name: Supabase Keep Alive

on:
  schedule:
    # Tiap 3 hari, jam 02:00 UTC
    - cron: "0 2 */3 * *"
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # GANTI dengan nama tabel yang bisa dibaca publik (RLS select untuk anon),
          # misalnya tabel games atau articles
          TABLE_NAME: games
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/$TABLE_NAME?select=*&limit=1" \
            > /dev/null
          echo "Supabase ping OK"
